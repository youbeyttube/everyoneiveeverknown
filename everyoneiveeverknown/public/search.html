<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search a Human</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="search-page">
  <a href="admin.html" class="login-button">Admin</a>

  <div class="search-container">

    <div class="index-card">
      <div class="card-tab" id="entryNumber">
        #0
      </div>

      <div class="card-lines">
        <p id="line1" class="card-line">Loading...</p>
        <p id="line2" class="card-line"></p>
        <p id="line3" class="card-line"></p>
      </div>

      <div class="admin-fields" id="adminFields" style="display:none;">
        <p><strong>Name:</strong> <span id="adminName"></span></p>
        <p><strong>Date Created:</strong> <span id="adminDate"></span></p>
      </div>
    </div>

    <button class="next-button" id="nextButton">Next Human</button>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search for a word...">
      <button id="searchButton">Search</button>
    </div>

    <div id="searchResults" class="results"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
