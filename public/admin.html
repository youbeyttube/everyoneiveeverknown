<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="admin-page">

  <a href="admin.html" class="login-button">Login</a>

  <div class="admin-container">

    <h2>Admin Login</h2>

    <div id="loginPanel">
      <input type="password" id="adminPassword" placeholder="Enter password">
      <button id="loginSubmit">Enter</button>
    </div>

    <div id="adminTools" style="display:none;">

      <h3>Create New Entry</h3>
      <input type="text" id="newName" placeholder="Name"><br><br>
      <input type="text" id="info1" placeholder="Sentence 1"><br><br>
      <input type="text" id="info2" placeholder="Sentence 2"><br><br>
      <input type="text" id="info3" placeholder="Sentence 3"><br><br>
      <button id="createEntry">Create Entry</button>

      <hr>

      <h3>Change Password</h3>
      <input type="password" id="oldPass" placeholder="Current password"><br><br>
      <input type="password" id="newPass" placeholder="New password"><br><br>
      <button id="changePass">Change Password</button>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
