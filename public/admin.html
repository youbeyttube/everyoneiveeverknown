<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Admin Panel</h1>

<div id="loginSection">
  <input type="password" id="adminPassword" placeholder="Password">
  <button id="loginBtn">Login</button>
</div>

<div id="adminSection" style="display:none;">
  <h2>Create New Entry</h2>
  <input type="text" id="newName" placeholder="Name"><br><br>
  <textarea id="newInfo" placeholder="Info (one per line)"></textarea><br><br>
  <button id="createBtn">Create</button>

  <hr>

  <h2>Edit Entry</h2>
  <div id="editPanel" style="display:none;">
    <input type="text" id="editName" placeholder="Name"><br><br>
    <textarea id="editInfo" placeholder="Info (one per line)"></textarea><br><br>
    <button id="saveEdit">Save Changes</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
